plugins {
    id 'java'
}

group = 'ufc.victor'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // MOA (Massive Online Analysis) - Provides the Hoeffding Tree (VFDT)
    implementation('nz.ac.waikato.cms.moa:moa:2023.04.0') {
        // Exclude missing dsol-xml transitive dependency from ssj
        exclude group: 'dsol', module: 'dsol-xml'
    }
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.3'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.register('runExperiment', JavaExec) {
    group = 'application'
    description = 'Runs the adaptive atomic commit experiment harness.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ufc.victor.experiment.ExperimentRunner'
}

tasks.register('runMariaDbDemo', JavaExec) {
    group = 'application'
    description = 'Runs the MariaDB XA-backed 2PC demo.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ufc.victor.MariaDbMain'
}

tasks.register('runMariaDbTpccCluster', JavaExec) {
    group = 'application'
    description = 'Runs distributed XA New-Order transactions on the four-node MariaDB cluster.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ufc.victor.MariaDbTpccClusterMain'
}

tasks.register('runMariaDbAlps', JavaExec) {
    group = 'application'
    description = 'Runs the prequential ALPS experiment with real MariaDB XA transactions.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ufc.victor.MariaDbAlpsMain'
}

tasks.register('runMariaDbDefensibleExperiment', JavaExec) {
    group = 'application'
    description = 'Runs paired multi-seed MariaDB protocol selection and regret experiments.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ufc.victor.MariaDbDefensibleExperimentMain'
}
